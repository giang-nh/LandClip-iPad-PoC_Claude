name: iPad PoC

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ipad-scaffold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build and test
        run: |
          set +e
          DEVICE_ID=$(xcrun simctl list devices available -j | \
            python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if "iPad" in x["name"]))')
          xcodebuild \
            -project LandClipIPad.xcodeproj \
            -scheme LandClipIPad \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee xcodebuild.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            grep -E '(^|: )(fatal )?error:' xcodebuild.log | tail -20 | \
              while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$STATUS"
