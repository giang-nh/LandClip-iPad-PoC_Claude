name: LandClipIPad
options:
  bundleIdPrefix: com.giangnh
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  LandClipIPad:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: GISCore/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giangnh.landclip.ipad.poc
        SWIFT_OBJC_BRIDGING_HEADER: App/LandClipIPad-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LandClip iPad PoC
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "2"
    scheme:
      testTargets:
        - LandClipIPadTests
  LandClipIPadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LandClipIPad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
