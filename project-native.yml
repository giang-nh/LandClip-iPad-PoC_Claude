name: LandClipIPad
options:
  bundleIdPrefix: com.giangnh
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  LandClipIPad:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: GISCore/Sources
      - path: Vendor/Resources
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Vendor/GDAL.xcframework
        embed: false
      - framework: Vendor/PROJ.xcframework
        embed: false
      - framework: Vendor/GEOS.xcframework
        embed: false
      - framework: Vendor/SQLite.xcframework
        embed: false
      - framework: Vendor/Archive.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giangnh.landclip.ipad.poc
        SWIFT_OBJC_BRIDGING_HEADER: App/LandClipIPad-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LandClip iPad PoC
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "2"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) LANDCLIP_WITH_GDAL=1"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor/GDAL.xcframework/ios-arm64/Headers"
          - "$(PROJECT_DIR)/Vendor/GDAL.xcframework/ios-arm64-simulator/Headers"
          - "$(PROJECT_DIR)/Vendor/Archive.xcframework/ios-arm64/Headers"
          - "$(PROJECT_DIR)/Vendor/Archive.xcframework/ios-arm64-simulator/Headers"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - -lc++
          - -lz
          - -liconv
          - -lxml2
    scheme:
      testTargets:
        - LandClipIPadTests
  LandClipIPadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Fixtures/public
        type: folder
        buildPhase: resources
    dependencies:
      - target: LandClipIPad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
