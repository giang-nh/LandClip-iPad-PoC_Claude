name: TestFlight

# Manual only. Requires these repo secrets (Settings → Secrets and variables →
# Actions):
#   APPLE_TEAM_ID        – 10-char team id (developer.apple.com → Membership)
#   APPSTORE_ISSUER_ID   – App Store Connect API issuer id (UUID)
#   APPSTORE_KEY_ID      – App Store Connect API key id
#   APPSTORE_PRIVATE_KEY – contents of the AuthKey_XXXX.p8 file
# See docs/TESTFLIGHT_VI.md for the full walkthrough.

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: brew install cmake ninja xcodegen

      - name: Restore native build cache
        id: native-cache
        uses: actions/cache@v5
        with:
          path: Vendor
          key: landclip-native-v2-gdal-3.11.4-proj-9.6.2-geos-3.14.1-sqlite-3500400-archive-3.8.9-${{ hashFiles('scripts/build-native-xcframeworks.sh') }}

      - name: Build native XCFrameworks
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-native-xcframeworks.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec project-native.yml

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo -n "${{ secrets.APPSTORE_PRIVATE_KEY }}" > "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8"

      - name: Archive
        run: |
          xcodebuild archive \
            -project LandClipIPad.xcodeproj \
            -scheme LandClipIPad \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LandClipIPad.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LandClipIPad.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}"
